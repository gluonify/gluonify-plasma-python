[project]
name = "gluonify-fastapi"
version = "0.1.0"
description = "FastAPI integration of the Gluonify SDK: Charm authentication and roles, health endpoints, app factory"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Gluonify" }]
keywords = ["gluonify", "fastapi", "charm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "gluonify==0.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://gluonify.io"
Source = "https://github.com/gluonify/gluonify-plasma-python"

# No "gluonify.uses" entry: this distribution reaches services only through gluonify, which carries the markers.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gluonify_fastapi"]

[project]
name = "gluonify"
version = "0.1.0"
description = "Gluonify SDK: zero-configuration discovery of platform services, Charm token verification, Top configuration and gDown (Bolt)"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Gluonify" }]
keywords = ["gluonify", "paas", "charm", "jwt", "neo4j", "bolt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyjwt[crypto]>=2.10",
    "neo4j>=5.28",
]

[project.urls]
Homepage = "https://gluonify.io"
Source = "https://github.com/gluonify/gluonify-plasma-python"

# The "uses" markers read by Bup (contract: README "The uses markers"). Name = service, value = the module that reaches it.
[project.entry-points."gluonify.uses"]
charm = "gluonify.charm"
gdown = "gluonify.gdown"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gluonify"]

# Workspace root (not a distribution): the distribution gluonify lives in packages/. See README "Why uv".
[project]
name = "gluonify-plasma-python"
version = "0.1.0"
description = "Workspace of the Gluonify Python SDK (not published)"
requires-python = ">=3.13"
dependencies = ["gluonify[fastapi]"]

[tool.uv]
package = false

[tool.uv.sources]
gluonify = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["gluonify"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["gluonify"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["gluonify"]

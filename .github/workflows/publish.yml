# Publication on PyPI by Trusted Publishing (OIDC): no token is stored anywhere.
# Triggered only by a release tag vX.Y.Z; the job waits for a manual approval of the "pypi" environment.
# PyPI side (once per project, see README "Publishing"): trusted publisher owner=gluonify, repository=gluonify-plasma-python,
# workflow=publish.yml, environment=pypi, for the project "gluonify" (FastAPI is its extra "fastapi").
name: publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Tests before publishing
        run: |
          uv sync --locked
          uv run ruff check .
          uv run mypy
          uv run pytest
      - name: The tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          v=$(python3 -c "import tomllib;print(tomllib.load(open('packages/gluonify/pyproject.toml','rb'))['project']['version'])")
          test "$v" = "$tag" || { echo "gluonify is $v, tag is $tag"; exit 1; }
      - name: Build
        run: uv build --package gluonify -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/gluonify/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing; also used to sign the PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish gluonify
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
